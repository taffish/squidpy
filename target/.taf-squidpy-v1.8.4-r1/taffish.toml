[package]
name = "squidpy"
kind = "tool"
version = "1.8.4"
release = 1
license = "Apache-2.0"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/squidpy"

[command]
name = "taf-squidpy"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/squidpy:1.8.4-r1"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64,linux/arm64"

[meta]
domain = "bio"
categories = ["spatial-omics", "spatial-transcriptomics", "image-analysis", "Python", "scverse", "visualization"]
keywords = ["Squidpy", "spatial omics", "spatial transcriptomics", "AnnData", "spatial graph", "Moran's I", "ligand-receptor", "ImageContainer", "SpatialData", "Scanpy", "SpatialLeiden"]
description = "Squidpy 1.8.4 Python runtime for scalable spatial-omics graph statistics, ligand-receptor analysis, microscopy image processing, static plotting, and the official Leiden extra."

[upstream]
name = "Squidpy"
type = "github"
repo = "scverse/squidpy"
homepage = "https://squidpy.readthedocs.io/en/stable/"
repository = "https://github.com/scverse/squidpy"
release_url = "https://github.com/scverse/squidpy/releases/tag/v1.8.4"
downloads = "https://files.pythonhosted.org/packages/70/08/dc10dbbbb823abb351b5d4f00d1c6066117d6bc4fc33f9f39a1be3bb1498/squidpy-1.8.4-py3-none-any.whl; https://files.pythonhosted.org/packages/95/1f/af1e0e45a9a29431c2ac5af4c65795f817f1a5a4087367e28ec1dd312587/squidpy-1.8.4.tar.gz"
version = "1.8.4"
license = "BSD-3-Clause"
citation = "Palla et al. Squidpy: a scalable framework for spatial omics analysis. Nature Methods 19, 171-178 (2022)."
doi = "10.1038/s41592-021-01358-2"
pmid = "35102346"
watch = "tags"
strip_prefix = "v"

[smoke]
backend = "docker"
timeout = 600
exist = ["python", "python3", "pip", "bash", "sh", "fc-list", "curl", "squidpy-data", "mahotas-features"]
test = ["python -m pip check && output=$(python -c 'from importlib.metadata import version; print(version(\"squidpy\"))') && test \"$output\" = 1.8.4 && help=$(python --help) && printf %s \"$help\" | grep -F 'usage:' >/dev/null && python /opt/squidpy/share/testdata/squidpy_smoke.py identity && grep -Fx 'upstream_commit=a27c14f24ee55e4d86f1aea6b77287316f816bcb' /opt/squidpy/share/doc/squidpy/SOURCE && grep -Fx 'wheel_sha256=e9458f9e09d9bb491210a1382727edc37d223a4a98352fbb0693aea34e241823' /opt/squidpy/share/doc/squidpy/SOURCE && grep -Fx 'docrep_source_sha256=ed8a17e201abd829ef8da78a0b6f4d51fb99a4cbd0554adbed3309297f964314' /opt/squidpy/share/doc/squidpy/SOURCE && grep -Fx 'constraints_sha256=30a094e11a66da237dac097d3570270b3f5e47d773c595deb465a85fc482ec6f' /opt/squidpy/share/doc/squidpy/SOURCE", "d=$(mktemp -d) && python /opt/squidpy/share/testdata/squidpy_smoke.py graph \"$d/out\" && test -s \"$d/out/squidpy_graph.h5ad\" && test -s \"$d/out/nhood_enrichment.png\" && test -s \"$d/out/moran.tsv\" && test -s \"$d/out/centrality.tsv\" && grep -F spatialleiden \"$d/out/versions.tsv\"", "d=$(mktemp -d) && python /opt/squidpy/share/testdata/squidpy_smoke.py ligrec \"$d/out\" && test -s \"$d/out/ligrec-means.tsv\" && test -s \"$d/out/ligrec-pvalues.tsv\" && test -s \"$d/out/local-interactions.tsv\" && grep -F local-dataframe \"$d/out/ligrec-summary.tsv\"", "d=$(mktemp -d) && python /opt/squidpy/share/testdata/squidpy_smoke.py image \"$d/out\" && test -s \"$d/out/input.tiff\" && test -s \"$d/out/image.png\" && test -d \"$d/out/image.zarr\" && grep -F segmentation_max \"$d/out/image-summary.tsv\"", "d=$(mktemp -d) && python /opt/squidpy/share/testdata/squidpy_smoke.py features \"$d/out\" && test -s \"$d/out/features.h5ad\" && test -s \"$d/out/gray8.tiff\" && test -s \"$d/out/gray16.tiff\"", "v=$(squidpy-data --version) && test \"$v\" = 'squidpy-data 1.8.4-r1' && squidpy-data install --dataset visium_fluo_adata_crop --dry-run && python /opt/squidpy/share/testdata/squidpy_smoke.py resource"]
