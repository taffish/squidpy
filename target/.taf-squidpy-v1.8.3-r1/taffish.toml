[package]
name = "squidpy"
kind = "tool"
version = "1.8.3"
release = 1
license = "Apache-2.0"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/squidpy"

[command]
name = "taf-squidpy"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/squidpy:1.8.3-r1"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64,linux/arm64"

[meta]
domain = "bio"
categories = ["spatial-omics", "spatial-transcriptomics", "image-analysis", "Python", "scverse", "visualization"]
keywords = ["Squidpy", "spatial omics", "spatial transcriptomics", "AnnData", "spatial graph", "Moran's I", "ligand-receptor", "ImageContainer", "SpatialData", "Scanpy", "SpatialLeiden"]
description = "Squidpy 1.8.3 Python runtime for scalable spatial-omics graph statistics, ligand-receptor analysis, microscopy image processing, static plotting, and the official Leiden extra."

[upstream]
name = "Squidpy"
type = "github"
repo = "scverse/squidpy"
homepage = "https://squidpy.readthedocs.io/en/stable/"
repository = "https://github.com/scverse/squidpy"
release_url = "https://github.com/scverse/squidpy/releases/tag/v1.8.3"
downloads = "https://files.pythonhosted.org/packages/2b/5c/3c5e524ee2aa8acdd05b298dd285ef7abbbdb3333b15e29738d34e0372bc/squidpy-1.8.3-py3-none-any.whl; https://files.pythonhosted.org/packages/a7/d8/e635e473e4a7605bfcb7ff5f0e5ee977beadde7c388d147e002cd7b86a85/squidpy-1.8.3.tar.gz"
version = "1.8.3"
license = "BSD-3-Clause"
citation = "Palla et al. Squidpy: a scalable framework for spatial omics analysis. Nature Methods 19, 171-178 (2022)."
doi = "10.1038/s41592-021-01358-2"
pmid = "35102346"
watch = "tags"
strip_prefix = "v"

[smoke]
backend = "docker"
timeout = 600
exist = ["python", "python3", "pip", "bash", "sh", "fc-list"]
test = ["python -m pip check && python --help 2>&1 | grep -F 'usage:' >/dev/null && python /opt/squidpy/share/testdata/squidpy_smoke.py identity | grep -Fx 'squidpy=1.8.3' >/dev/null && grep -Fx 'upstream_commit=005c9056fea7c5432fb220abc9b48a384fb8c090' /opt/squidpy/share/doc/squidpy/SOURCE >/dev/null && grep -Fx 'wheel_sha256=05fd5da00db697e6d0dbb91ff543ff5b27d0046666ce5a7348548076b3310efc' /opt/squidpy/share/doc/squidpy/SOURCE >/dev/null && grep -Fx 'docrep_source_sha256=ed8a17e201abd829ef8da78a0b6f4d51fb99a4cbd0554adbed3309297f964314' /opt/squidpy/share/doc/squidpy/SOURCE >/dev/null && grep -Fx 'constraints_sha256=0a33978dca71c6f1f302eeec1cf3f90cf94f343649ea854bc35064f112604541' /opt/squidpy/share/doc/squidpy/SOURCE >/dev/null", "tmp=/tmp/taf-squidpy-graph-$$; rm -rf \"$tmp\"; python /opt/squidpy/share/testdata/squidpy_smoke.py graph \"$tmp\" && test -s \"$tmp/squidpy_graph.h5ad\" && test -s \"$tmp/nhood_enrichment.png\" && test -s \"$tmp/moran.tsv\" && test -s \"$tmp/centrality.tsv\" && test -s \"$tmp/versions.tsv\" && grep -F 'spatialleiden' \"$tmp/versions.tsv\" >/dev/null && rm -rf \"$tmp\"", "tmp=/tmp/taf-squidpy-ligrec-$$; rm -rf \"$tmp\"; python /opt/squidpy/share/testdata/squidpy_smoke.py ligrec \"$tmp\" && test -s \"$tmp/ligrec-means.tsv\" && test -s \"$tmp/ligrec-pvalues.tsv\" && test -s \"$tmp/local-interactions.tsv\" && grep -F 'interaction_source' \"$tmp/ligrec-summary.tsv\" >/dev/null && grep -F 'local-dataframe' \"$tmp/ligrec-summary.tsv\" >/dev/null && rm -rf \"$tmp\"", "tmp=/tmp/taf-squidpy-image-$$; rm -rf \"$tmp\"; python /opt/squidpy/share/testdata/squidpy_smoke.py image \"$tmp\" && test -s \"$tmp/input.tiff\" && test -s \"$tmp/image.png\" && test -s \"$tmp/image-summary.tsv\" && test -d \"$tmp/image.zarr\" && grep -F 'segmentation_max' \"$tmp/image-summary.tsv\" >/dev/null && rm -rf \"$tmp\""]
